<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Confirmed Orders - Delivery Slips ({{TotalCount}} Orders)</title>
    <style>
        :root {
            --primary: #0f172a;
            --primary-light: #f8fafc;
            --primary-border: #cbd5e1;
            --bg: #ffffff;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #000000;
            --badge-bg: #000000;
            --badge-text: #ffffff;
            --strip-bg: #f1f5f9;
        }

        /* ---------- BASE ---------- */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            color-adjust: exact !important;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            background: var(--bg);
            font-size: 8.5pt;
            line-height: 1.35;
            padding: 12px;
        }

        .label-wrapper {
            width: 100%;
            max-width: 180mm;
            margin: 0 auto;
        }

        /* ---------- CARDS ---------- */
        .shipping-label-card,
        .manifest-card,
        .backside-label-card {
            border: 0.3mm solid #000;
            background: #fff;
            break-inside: avoid;
            page-break-inside: avoid;
            margin-bottom: 0;
        }

        /* ---------- HEADER ---------- */
        .header-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 26mm;
            border-bottom: 0.3mm solid #000;
        }

        .header-left {
            padding: 4mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            min-width: 0;
        }

        /* LOGO STYLES - FIXED SIZING */
        .brand-logo-img {
            display: block;
            width: 100%;
            max-width: 60mm;
            height: 22mm;
            object-fit: contain;
            margin-bottom: 2mm;
            filter: contrast(200%);
        }

        .brand-title {
            font-size: 18pt;
            font-weight: 900;
            letter-spacing: 1px;
            line-height: 1.1;
            color: #000;
            text-shadow: 0.3mm 0.3mm 0px #cbd5e1;
        }

        .brand-tagline {
            font-size: 8pt;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-top: 1.5mm;
            line-height: 1.3;
            color: #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5mm;
        }

            .brand-tagline::before,
            .brand-tagline::after {
                content: "";
                height: 0.3mm;
                width: 15mm;
                background-color: #000;
                opacity: 0.3;
            }

        .qr-cell {
            border-left: 0.3mm solid #000;
            padding: 2mm;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: #fff;
        }

        .qr-img {
            width: 22mm;
            height: 22mm;
            display: block;
            object-fit: contain;
        }

        .qr-text {
            font-family: "Courier New", Courier, monospace;
            font-size: 7.5pt;
            font-weight: 800;
            margin-top: 1mm;
            letter-spacing: 0.3px;
            word-break: break-all;
            line-height: 1.15;
            color: #000;
        }

        /* ---------- FROM / TO GRID WITH CENTER ARROW ---------- */
        .from-to-grid {
            display: grid;
            grid-template-columns: 1fr 12mm 1fr;
            border-bottom: 0.3mm solid #000;
        }

        .address-col {
            padding: 2.5mm 3.5mm;
            min-width: 0;
        }

        .from-col {
            border-right: 0.3mm solid #000;
            background-color: #fafafa;
        }

        .arrow-col {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #fff;
            border-right: 0.3mm solid #000;
        }

        .sec-title {
            font-size: 7.5pt;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 1.5mm;
            color: #1f2937;
            display: flex;
            align-items: center;
            gap: 1mm;
        }

        .party-name {
            font-size: 10.5pt;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 1mm;
            line-height: 1.2;
            word-break: break-word;
            color: #000;
        }

        .address-lines {
            font-size: 8.5pt;
            line-height: 1.45;
            color: #111827;
            margin-bottom: 1mm;
            word-break: break-word;
            text-transform: uppercase;
        }

        .pincode-badge {
            display: inline-block;
            font-size: 12pt;
            font-weight: 900;
            letter-spacing: 1px;
            margin-top: 1mm;
            padding: 0.8mm 2.5mm;
            background-color: #000 !important;
            color: #fff !important;
            border: 0.3mm solid #000;
            box-shadow: inset 0 0 0 1000px #000 !important;
        }

        .contact-line {
            font-size: 8.5pt;
            font-weight: 700;
            margin-top: 1mm;
            word-break: break-word;
            color: #000;
            text-transform: uppercase;
        }

        /* ---------- SPECS STRIP ---------- */
        .specs-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 2mm 6mm;
            justify-content: space-between;
            padding: 2mm 3.5mm;
            background-color: #f1f5f9;
            border-bottom: 0.25mm solid #000;
            font-size: 8pt;
            color: #0f172a;
        }

        .order-info-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 4mm;
            padding: 2mm 3.5mm;
            font-size: 8.5pt;
            font-weight: 700;
            background: #fff;
        }

        .order-meta-info {
            flex: 1 1 auto;
            min-width: 0;
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 1.5mm;
            word-break: break-word;
            color: #0f172a;
        }

            .order-meta-info strong {
                font-weight: 900;
                color: #000;
            }

        .order-barcode-cell {
            flex: 0 0 auto;
        }

            .order-barcode-cell img {
                display: block;
                width: 200px;
                height: 35px;
                object-fit: fill;
            }

        /* ---------- CUT DIVIDERS ---------- */
        .cut-divider {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 12mm;
            margin: 0;
            background: #fff;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .cut-line {
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            border-top: 0.4mm dashed #000;
            z-index: 1;
        }

        .cut-badge {
            position: relative;
            z-index: 2;
            display: inline-flex;
            align-items: center;
            gap: 1.5mm;
            padding: 0;
            background-color: #fff !important;
            color: #000;
            font-size: 7.5pt;
            font-weight: 800;
            letter-spacing: 0.6px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .cut-scissors {
            flex: 0 0 auto;
        }

        /* ---------- MANIFEST TABLE ---------- */
        table.items-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 8.5pt;
            table-layout: fixed;
            overflow: hidden;
        }

            table.items-table thead {
                display: table-header-group;
            }

            table.items-table tr {
                break-inside: avoid;
                page-break-inside: avoid;
            }

            table.items-table th {
                background-color: #000 !important;
                color: #fff !important;
                font-weight: 800;
                text-transform: uppercase;
                font-size: 7.5pt;
                letter-spacing: 0.4px;
                padding: 2mm 2.5mm;
                border: 0.2mm solid #000;
                box-shadow: inset 0 0 0 1000px #000 !important;
                text-align: left;
            }

            table.items-table td {
                padding: 1.5mm 2.5mm;
                border: 0.2mm solid #000;
                vertical-align: middle;
                word-break: break-word;
            }

        .col-sno {
            width: 10mm;
            text-align: center;
        }

        .col-qty {
            width: 22mm;
            text-align: center;
            font-weight: 800;
        }

        .combo-badge {
            display: inline-block;
            padding: 0.5mm 1.8mm;
            font-size: 6.5pt;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            background: #ede9fe;
            color: #5b21b6;
            border: 0.2mm solid #c4b5fd;
            border-radius: 2px;
            vertical-align: middle;
        }

        .combo-box {
            margin-top: 1mm;
            padding: 0;
            background: #fff;
            border: 0.3mm solid #000;
            border-radius: 0;
        }

        .combo-box-title {
            font-size: 6.8pt;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            color: #000;
            padding: 1mm 1.5mm;
            margin: 0;
            border-bottom: 0.2mm solid #000;
        }

        table.combo-subtable {
            width: 100%;
            border-collapse: collapse;
            font-size: 7.5pt;
            background: #fff;
            table-layout: fixed;
        }

            table.combo-subtable th,
            table.combo-subtable td {
                border: 0;
                border-bottom: 0.15mm solid #000;
                padding: 1mm 1.5mm;
                color: #000;
                text-align: left;
                vertical-align: middle;
            }

            table.combo-subtable th {
                background: #fff;
                font-size: 6.5pt;
                font-weight: 800;
                text-transform: uppercase;
            }

                table.combo-subtable th:first-child,
                table.combo-subtable td:first-child {
                    width: 12mm;
                    text-align: center;
                    border-right: 0.3mm solid #000;
                }

            table.combo-subtable tr:last-child td {
                border-bottom: 0;
            }

        /* ---------- INTERNAL QR BANNER ---------- */
        .internal-qr-banner {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 2mm 3.5mm;
            background-color: #fafafa;
            border-bottom: 0.3mm solid #000;
        }

        .qr-banner-left {
            display: flex;
            align-items: center;
            gap: 3mm;
        }

        .qr-banner-img {
            width: 14mm;
            height: 14mm;
            display: block;
            border: 0.2mm solid #000;
            padding: 0.5mm;
            background: #fff;
        }

        .qr-banner-text {
            display: flex;
            flex-direction: column;
            gap: 0.5mm;
        }

        .qr-banner-title {
            font-size: 7.5pt;
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #000;
        }

        .qr-banner-order {
            font-family: "Courier New", Courier, monospace;
            font-size: 11pt;
            font-weight: 900;
            color: #000;
            line-height: 1.1;
        }

        .qr-banner-contract {
            font-size: 7pt;
            font-weight: 700;
            color: #4b5563;
        }

        /* ---------- PEN CHECKBOXES ---------- */
        .chk-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2mm;
        }

        .chk-box {
            width: 3.5mm;
            height: 3.5mm;
            border: 0.35mm solid #000;
            background: #fff;
            display: inline-block;
        }

        .chk-box-small {
            width: 3mm;
            height: 3mm;
            border: 0.3mm solid #000;
            background: #fff;
            display: inline-block;
        }

        /* ---------- BACKSIDE LABEL (STACKED) ---------- */
        .backside-label-card {
            display: flex;
            flex-direction: column;
            background: #fff;
            border: 0.3mm solid #000;
            break-inside: avoid;
            page-break-inside: avoid;
        }

        .backside-header {
            background-color: #000 !important;
            color: #fff !important;
            text-align: center;
            padding: 3mm;
            font-size: 14pt;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: inset 0 0 0 1000px #000 !important;
            border-bottom: 0.3mm solid #000;
        }

        .backside-body {
            padding: 4mm 4mm;
        }

        .handling-icons-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            width: 100%;
            gap: 4mm;
            text-align: center;
        }

        .handling-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 2mm;
        }

        .handling-icon-box {
            width: 14mm;
            height: 14mm;
            border: 0.4mm solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 2mm;
            background-color: #fafafa;
            flex-shrink: 0;
        }

            .handling-icon-box svg {
                width: 8mm;
                height: 8mm;
            }

        .handling-text {
            font-size: 10pt;
            font-weight: 900;
            text-transform: uppercase;
            color: #000;
            line-height: 1;
        }

        .handling-subtext {
            font-size: 7pt;
            font-weight: 700;
            color: #4b5563;
            line-height: 1.1;
            margin-top: 1mm;
        }

        /* ---------- PRINT & MULTI-PAGE ---------- */
        @page {
            size: A4 portrait;
            margin: 6mm;
        }

        @media print {
            html,
            body {
                padding: 0 !important;
                margin: 0 !important;
                background: #fff !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                font-size: 8pt;
            }

            .label-wrapper {
                max-width: 100% !important;
                margin: 0 auto !important;
            }

            .slip-page {
                page-break-after: always !important;
                break-after: page !important;
                clear: both !important;
                margin: 0 !important;
                padding: 0 !important;
                box-shadow: none !important;
                width: 100% !important;
                max-width: 100% !important;
                zoom: 0.98;
                transform: scale(0.98);
                transform-origin: top left;
            }

                .slip-page:last-child {
                    page-break-after: auto !important;
                    break-after: auto !important;
                }

            .shipping-label-card,
            .manifest-card,
            .backside-label-card {
                border: 0.3mm solid #000 !important;
            }

            .from-to-grid,
            .header-grid,
            .specs-strip {
                border-color: #000 !important;
            }

            .arrow-col {
                background-color: #fff !important;
                border-right: 0.3mm solid #000 !important;
            }

            .cut-line {
                border-top: 0.4mm dashed #000 !important;
            }

            .cut-badge {
                background-color: #fff !important;
                color: #000 !important;
            }

            .pincode-badge {
                background-color: #000 !important;
                color: #fff !important;
                border: 0.3mm solid #000 !important;
                box-shadow: inset 0 0 0 1000px #000 !important;
            }

            table.items-table th {
                background-color: #000 !important;
                color: #fff !important;
                border: 0.2mm solid #000 !important;
                box-shadow: inset 0 0 0 1000px #000 !important;
            }

            .specs-strip {
                background-color: #f1f5f9 !important;
            }

            .from-col {
                background-color: #fafafa !important;
            }

            .combo-badge {
                background: #000 !important;
                color: #fff !important;
                border: 0.2mm solid #000 !important;
                box-shadow: inset 0 0 0 1000px #000 !important;
            }

            .combo-box {
                background: #fff !important;
                border: 0.3mm solid #000 !important;
            }

            .combo-box-title {
                border-bottom: 0.2mm solid #000 !important;
            }

            table.combo-subtable th,
            table.combo-subtable td {
                background: #fff !important;
                color: #000 !important;
                border: 0 !important;
                border-bottom: 0.15mm solid #000 !important;
                box-shadow: none !important;
            }

                table.combo-subtable th:first-child,
                table.combo-subtable td:first-child {
                    border-right: 0.3mm solid #000 !important;
                }

            table.combo-subtable tr:last-child td {
                border-bottom: 0 !important;
            }

            .backside-header {
                background-color: #000 !important;
                color: #fff !important;
                box-shadow: inset 0 0 0 1000px #000 !important;
            }

            a[href]::after {
                content: none !important;
            }
        }

        @media screen {
            body {
                background-color: #f1f5f9;
                padding: 30px 16px;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 28px;
            }

            .slip-page {
                background: #fff;
                box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
                padding: 16px;
                border-radius: 8px;
                max-width: 190mm;
                width: 100%;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>
    {{OrderSlipsHtml}}
</body>

</html>
